name: Decode screenshots

on:
  push:
    branches: [main]
    paths:
      - "docs/screenshots/payload/**"
      - ".github/workflows/decode-screenshots.yml"
  workflow_dispatch:

concurrency:
  group: decode-screenshots
  cancel-in-progress: true

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Concat payload parts, decode, and verify sha256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import shutil
          import sys
          from pathlib import Path

          expected = {
              "01-setup-chat.png": (
                  "01-setup-chat",
                  10,
                  "732bdd7e06d3086b030cb0b11777deeb934c07d593249890e1c961c355ccd639",
              ),
              "02-agents-list.png": (
                  "02-agents-list",
                  10,
                  "6bce0b81ea7dc4e41d60bc81f98f07532e14c3ac4c3252fe44ad8d18e62fd7d4",
              ),
              "03-desk-improver-hillclimb.png": (
                  "03-desk-improver-hillclimb",
                  12,
                  "270f09cef3facfebb8a08e6a04703de975966e15ac29aade4af4709bf9175c42",
              ),
              "04-identity-gate.png": (
                  "04-identity-gate",
                  9,
                  "5631d0615f9c2c701281e08f37dd30e198c35b7b3f4efdaf20b639c4847ca99a",
              ),
          }

          payload = Path("docs/screenshots/payload")
          dest_dir = Path("docs/screenshots")
          tmp = Path(".screenshot-decode-tmp")
          if tmp.exists():
              shutil.rmtree(tmp)
          tmp.mkdir()

          missing = []
          for name, (stem, count, _) in expected.items():
              for i in range(count):
                  part = payload / f"{stem}.part{i:02d}"
                  if not part.is_file():
                      missing.append(str(part))
          if missing:
              print("Payload incomplete; skip decode (no PNG written).")
              for item in missing:
                  print(f"  missing {item}")
              shutil.rmtree(tmp)
              Path("/tmp/decode-screenshots-skip").write_text("incomplete\n")
              sys.exit(0)

          for name, (stem, count, digest) in expected.items():
              parts = [payload / f"{stem}.part{i:02d}" for i in range(count)]
              raw = b"".join(p.read_bytes() for p in parts)
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except Exception as err:
                  shutil.rmtree(tmp, ignore_errors=True)
                  raise SystemExit(f"base64 decode failed for {name}: {err}") from err
              got = hashlib.sha256(decoded).hexdigest()
              if got != digest:
                  shutil.rmtree(tmp, ignore_errors=True)
                  raise SystemExit(f"sha256 mismatch for {name}: {got} != {digest}")
              if decoded[:8] != b"\x89PNG\r\n\x1a\n":
                  shutil.rmtree(tmp, ignore_errors=True)
                  raise SystemExit(f"{name} is not a PNG")
              out = tmp / name
              out.write_bytes(decoded)
              print(f"OK {name} {got} {len(decoded)} bytes")

          dest_dir.mkdir(parents=True, exist_ok=True)
          changed = False
          for name, (_, _, digest) in expected.items():
              target = dest_dir / name
              data = (tmp / name).read_bytes()
              if target.is_file() and hashlib.sha256(target.read_bytes()).hexdigest() == digest:
                  print(f"unchanged {name}")
                  continue
              target.write_bytes(data)
              changed = True
              print(f"wrote {name}")
          shutil.rmtree(tmp)
          Path("/tmp/decode-screenshots-changed").write_text("1\n" if changed else "0\n")
          PY

      - name: Commit verified PNGs
        run: |
          set -euo pipefail
          if [ -f /tmp/decode-screenshots-skip ]; then
            echo "Skip commit: payload incomplete."
            exit 0
          fi
          if [ "$(cat /tmp/decode-screenshots-changed)" != "1" ]; then
            echo "Skip commit: PNGs already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/01-setup-chat.png \
            docs/screenshots/02-agents-list.png \
            docs/screenshots/03-desk-improver-hillclimb.png \
            docs/screenshots/04-identity-gate.png
          git commit -m "Add verified orbital console screenshots."
          git push origin HEAD:main
